name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # DATABASE_URL sem credenciais — prisma generate não conecta ao banco
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://localhost/dindin_ci"
          DIRECT_URL: "postgresql://localhost/dindin_ci"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://localhost/dindin_ci"
          DIRECT_URL: "postgresql://localhost/dindin_ci"
          AUTH_SECRET: "ci-test-secret-for-jwt-signing-only"
